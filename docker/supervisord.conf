[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/supervisor.log
stderr_logfile=/var/log/nginx/supervisor_error.log

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm-error.log

[program:queue-worker]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=0
autostart=true
autorestart=true
numprocs=2
stdout_logfile=/var/log/queue-worker.log
stderr_logfile=/var/log/queue-worker-error.log

[program:scheduler]
command=php /var/www/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/var/log/scheduler.log
stderr_logfile=/var/log/scheduler-error.log